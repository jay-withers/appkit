name: ci-python

# Runs the test suite and mypy on a pull request, through the shared
# jay-withers/workflows python.yml. Every app pins a release of this library,
# so a red suite here is a broken app on its next bump.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # For the coverage comment. A called workflow can never hold more than its
  # caller grants.
  pull-requests: write

jobs:
  test:
    # Not path filtered: a required check skipped by a path filter never
    # reports, which blocks a pull request rather than passing it.
    uses: jay-withers/workflows/.github/workflows/python.yml@a50f010c3052f2d14a9f3a49ed54b9576429dcd6 # v1.29.0
    with:
      working-directory: .
      # The apps' runtime image is Python 3.14.
      python-version: "3.14"
      # Every extra, so every module's tests run.
      extras: dev azure backup web e2e
      # Chromium for test_testing.py's browser tests.
      playwright: true
      coverage: appkit
      coverage-pr-comment: true
      diff-coverage: "80"
      typecheck: mypy
