name: ci-python

# Runs the test suite, mypy, ruff and both coverage floors on a pull request,
# through the shared jay-withers/workflows python.yml. Every app pins a release of this library,
# so a red suite here is a broken app on its next bump.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Not path filtered: a required check skipped by a path filter never
    # reports, which blocks a pull request rather than passing it.
    uses: jay-withers/workflows/.github/workflows/python.yml@93bff29fb7e15a3669a1f120ab0c3a2940a413d6 # v1.34.0
    with:
      working-directory: .
      # mise.toml's python, which python.yml runs; it must stay the apps'
      # runtime image's (dev-containers python-app), whose own ci-container-build
      # checks hold them together.
      # Every extra, so every module's tests run.
      extras: dev azure backup web e2e
      # Chromium for test_testing.py's browser tests.
      playwright: true
      coverage: appkit
      # Both floors fail the check: the total, so the library can't slip, and
      # the lines a PR changes, so new code comes with its tests. The table
      # is in the job summary; there is no PR comment.
      coverage-min: "90"
      diff-coverage: "90"
      typecheck: mypy
      # ruff check and ruff format --check, from the locked dev extra, so CI
      # runs the ruff `make lint` does.
      lint: true
