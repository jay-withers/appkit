[project]
name = "appkit"
# Never bumped: the release is the git tag cd-tag makes on merge, and apps pin
# that tag (README.md, "Using it").
version = "0.0.0"
description = "Shared building blocks for the jay-withers apps on Container Apps"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# headers.py and passcode.py: FastAPI middleware and dependencies. An extra,
# not core, so a batch job using only keyvault, backup or selfcheck (repo-agent,
# market-agent's job) doesn't install a web framework it never imports.
web = ["fastapi>=0.115"]
# testing.py: browser tests in an app's tests/e2e/, against a real Chromium.
e2e = ["pytest-playwright>=0.7"]
# keyvault.py: secret resolution and the Azure credential.
azure = [
  "azure-identity>=1.19",
  "azure-keyvault-secrets>=4.9",
  "python-dotenv>=1.0",
]
# backup.py's run: age encryption, and R2 through its S3 API.
backup = [
  "pyrage>=1.4",
  "boto3>=1.44",
]
# httpx2, not httpx: starlette's TestClient deprecated the latter, and with
# `filterwarnings = ["error"]` below that deprecation fails collection.
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "httpx2>=0.28",
  # The tests' login route parses a form.
  "python-multipart>=0.0.20",
  # test_testing.py serves its e2e app with uvicorn, as the apps serve theirs.
  "uvicorn>=0.34",
  "mypy>=2.4.1",
  "boto3-stubs[s3]>=1.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appkit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S: bandit's security rules, so a risky pattern fails the commit locally.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Cookie", "fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

# pyrage ships no type information.
[[tool.mypy.overrides]]
module = ["pyrage", "pyrage.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Warnings are errors, so a deprecation in a dependency is seen on the bump
  # that introduced it rather than on the release that removes the feature.
  "error",
  # Raised inside starlette's own TestClient import, not by anything here.
  "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
